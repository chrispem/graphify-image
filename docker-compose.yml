# graphify on Dokploy — one system (rename "graphify" -> "<system>" for others)
#
# Dokploy: Compose service, source = the Git repo containing this file + Dockerfile + index.sh
# Environment tab:
#   GRAPH_API_KEY=<long random string>
#   REPO_URL=https://<pat>@dev.azure.com/org/project/_git/myapp
#   GRAPH_HOST=graph.draw.football
#   GRAPH_UI_USERS=chris:$$apr1$$...     # htpasswd -nb chris 'password', then double every $
# Routing is done by the Traefik labels below — no Domains tab entry needed.
#   https://GRAPH_HOST/mcp               -> MCP server (bearer key)
#   https://GRAPH_HOST/graph/graph.html  -> interactive graph (basic auth)
#   https://GRAPH_HOST/graph/GRAPH_REPORT.md
# Schedule:  docker compose --profile index run --rm graphify-indexer && docker compose restart graphify-graph
# First run: same command as the schedule, once, after the first deploy

services:

  graphify-graph:
    build:
      context: .
    image: graphify:local
    command: >
      /data/graph.json
      --transport http --host 0.0.0.0 --port 8080
      --api-key ${GRAPH_API_KEY}
      --stateless
    environment:
      - GRAPHIFY_MAX_GRAPH_BYTES=1GB
    volumes:
      - ../files/graphify-graph:/data:ro
    networks:
      - dokploy-network
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTPS
      - traefik.http.routers.graphify.rule=Host(`${GRAPH_HOST}`)
      - traefik.http.routers.graphify.entrypoints=websecure
      - traefik.http.routers.graphify.tls.certresolver=letsencrypt
      - traefik.http.routers.graphify.priority=10
      - traefik.http.routers.graphify.service=graphify
      - traefik.http.services.graphify.loadbalancer.server.port=8080
      # HTTP -> HTTPS redirect
      - traefik.http.routers.graphify-http.rule=Host(`${GRAPH_HOST}`)
      - traefik.http.routers.graphify-http.entrypoints=web
      - traefik.http.routers.graphify-http.middlewares=graphify-redir
      - traefik.http.middlewares.graphify-redir.redirectscheme.scheme=https
      - traefik.http.middlewares.graphify-redir.redirectscheme.permanent=true

  graphify-ui:
    image: nginx:alpine
    volumes:
      - ../files/graphify-graph:/usr/share/nginx/html:ro
    networks:
      - dokploy-network
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.graphify-ui.rule=Host(`${GRAPH_HOST}`) && PathPrefix(`/graph`)
      - traefik.http.routers.graphify-ui.entrypoints=websecure
      - traefik.http.routers.graphify-ui.tls.certresolver=letsencrypt
      - traefik.http.routers.graphify-ui.priority=20
      - traefik.http.routers.graphify-ui.middlewares=graphify-ui-strip,graphify-ui-auth
      - traefik.http.routers.graphify-ui.service=graphify-ui
      - traefik.http.middlewares.graphify-ui-strip.stripprefix.prefixes=/graph
      - traefik.http.middlewares.graphify-ui-auth.basicauth.users=${GRAPH_UI_USERS}
      - traefik.http.services.graphify-ui.loadbalancer.server.port=80

  graphify-indexer:
    image: graphify:local
    entrypoint: ["sh", "/index.sh"]
    environment:
      - REPO_URL=${REPO_URL}
    volumes:
      - ../files/graphify-graph:/data
      - ../files/graphify-src:/src
    networks:
      - dokploy-network
    restart: "no"
    profiles: ["index"]

networks:
  dokploy-network:
    external: true
